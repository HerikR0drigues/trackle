# Render blueprint — provisions the API web service + a managed Postgres
# database in one click. Use:
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → connect repo, pick this file.
#   3. After first deploy, run `prisma:migrate:deploy` then `seed` from the
#      service Shell tab to populate the Track pool.
#
# Free tier caveats: web service spins down after 15 min idle (cold start
# ~30s); Postgres free is single-instance and 90-day retention.
services:
  - type: web
    name: musicle-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ITUNES_BASE_URL
        value: https://itunes.apple.com
      - key: CORS_ORIGIN
        sync: false # set this to your Vercel frontend URL after first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: musicle-db
          property: connectionString

databases:
  - name: musicle-db
    databaseName: musicle
    user: musicle
    plan: free
