services:
  postgres:
    image: postgres:16-alpine
    container_name: musicle-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicle
      POSTGRES_PASSWORD: musicle
      POSTGRES_DB: musicle
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicle -d musicle"]
      interval: 5s
      timeout: 5s
      retries: 10
